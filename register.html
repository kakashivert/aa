<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - KnowPoint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Kayıt Ol</h1>
        <p>KnowPoint'e katılarak favori konularınıza erişim sağlayabilirsiniz!</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Ana Sayfa</a></li>
            <li><a href="login.html">Giriş Yap</a></li>
        </ul>
    </nav>

    <main>
        <form action="#" method="post">
            <label for="username">Kullanıcı Adı:</label>
            <input type="text" id="username" name="username" placeholder="Kullanıcı adınızı girin" required>

            <label for="email">E-posta:</label>
            <input type="email" id="email" name="email" placeholder="E-posta adresinizi girin" required>

            <label for="password">Şifre:</label>
            <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required>

            <label for="confirm-password">Şifreyi Onayla:</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Şifrenizi tekrar girin" required>

            <button type="submit">Kayıt Ol</button>
        </form>
    </main>

    <footer>
        <p>© 2024 KnowPoint - Tüm hakları saklıdır.</p>
    </footer>
</body>
</html>
